name: Build Keepit — Complet
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 🪄 Télécharger gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -la gradle/wrapper/

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔨 Compiler APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: 📦 Télécharger APK
        uses: actions/upload-artifact@v4
        with:
          name: Keepit-APK-Complet
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
