name: Build Keepit — Debug & Release

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compiler APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: ☕ Configurer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🛠️ Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: 🔨 Compiler Debug + Release
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug assembleRelease --no-daemon

      - name: ✅ APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: Keepit-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: 📦 APK Release
        uses: actions/upload-artifact@v4
        with:
          name: Keepit-APK-Release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 14
