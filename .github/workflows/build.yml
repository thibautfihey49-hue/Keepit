name: Build Keepit — CORRECTION FINALE
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Récupérer le code
        uses: actions/checkout@v4

      - name: 🪄 Créer dossier + TÉLÉCHARGER gradle-wrapper.jar
        run: |
          mkdir -p gradle/wrapper
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar
          chmod +x gradlew
          ls -la gradle/wrapper/
          echo "✅ Fichier .jar prêt !"

      - name: ☕ Installer Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 🔨 Compiler l'APK
        run: ./gradlew clean assembleDebug --no-daemon

      - name: 📦 APK Prêt !
        uses: actions/upload-artifact@v4
        with:
          name: Keepit-APK-Final
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
